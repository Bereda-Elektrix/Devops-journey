name: Budowanie, skanowanie i push obrazu
#ok
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Pobierz kod z repozytorium
      uses: actions/checkout@v3

    # Krok 1: Logowanie do Docker Hub za pomocą sekretów
    - name: Zaloguj do Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Krok 2: Budowanie obrazu i nadanie mu tagu
    - name: Zbuduj obraz Docker
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moj-pierwszy-obraz:latest .

    # Krok 3: Skanowanie bezpieczeństwa (szukanie podatności)
    - name: Skanowanie podatności (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/moj-pierwszy-obraz:latest'
        format: 'table'
        exit-code: '1' # Jeśli znajdzie błędy krytyczne, zatrzyma pipeline
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    - name: Wypchnij obraz do Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/moj-pierwszy-obraz:latest
